[project]
name = "wily-client"
version = "0.1.0"
description = "Drive the wily desktop app from Python: proxies, profiles, launching browsers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "wily" }]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# Ranges, not pins: this is a library, and a script that installs it has its own httpx and pydantic.
dependencies = [
    "httpx>=0.27,<1",
    "httpcore>=1.0.5,<2",
    "pydantic>=2.7,<3",
    # Finds a running profile's browser process and its --proxy-server, on all three OSes.
    "psutil>=5.9,<8",
]

[project.urls]
Homepage = "https://wily.bot/docs/libraries/"
Source = "https://github.com/wilyhq/wily-python"

[dependency-groups]
dev = [
    "ty==0.0.15",
    "ruff==0.16.8",
    "import-linter==2.15",
    "complexipy==5.6.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
# Nothing younger than a week is installed: a poisoned release is usually pulled within days.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
timeout = 60
markers = [
    "real_app: runs `wily serve` from WILY_BIN; skipped without it (make test-real)",
]
